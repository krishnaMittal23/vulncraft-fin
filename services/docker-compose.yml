services:
  web:
    build: .
    # Invoke via bash so the bind-mounted entrypoint runs regardless of its
    # host file mode (the .:/app mount shadows the image's chmod +x).
    command: ["bash", "./entrypoint.sh"]
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DEBUG=False
      - OWASP_ZAP_URL=http://owasp-zap:8080
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET}
      - GITHUB_APP_ID=${GITHUB_APP_ID}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - SCANNER_SHARED_SECRET=${SCANNER_SHARED_SECRET}
      - ALLOW_PRIVATE_SCAN_TARGETS=${ALLOW_PRIVATE_SCAN_TARGETS:-False}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      - owasp-zap
    networks:
      - vulncraft-network

  owasp-zap:
    image: zaproxy/zap-stable:latest
    container_name: vulncraft-owasp-zap
    ports:
      - "8080:8080"
    command: ["zap.sh", "-daemon", "-host", "0.0.0.0", "-port", "8080", "-config", "api.disablekey=true", "-config", "api.addrs.addr.name=.*", "-config", "api.addrs.addr.regex=true"]
    environment:
      - ZAP_PROXY=8080
    volumes:
      - zap-data:/zap/wrk
    networks:
      - vulncraft-network

  # Optional: enables the durable workflow queue, shared rate limiting,
  # Socket.IO scaling, and repo caching. Set REDIS_URL=redis://localhost:6379
  # in backend/.env to turn it on.
  redis:
    image: redis:7-alpine
    container_name: vulncraft-redis
    ports:
      - "6379:6379"
    networks:
      - vulncraft-network
    volumes:
      - redis-data:/data

networks:
  vulncraft-network:
    driver: bridge

volumes:
  zap-data:
  redis-data:
